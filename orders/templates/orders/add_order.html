<!DOCTYPE html>
<html>
<head>
  <title>Add Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-6 rounded shadow w-96">
  <h2 class="text-xl font-bold mb-4">Add Order</h2>

  <form method="POST">
    {% csrf_token %}

    <input type="text" name="name" placeholder="Customer Name"
      class="w-full mb-3 p-2 border rounded" required>

    <input type="text" name="phone" placeholder="Phone"
      class="w-full mb-3 p-2 border rounded" required>

    <input type="text" name="product" placeholder="Product"
      class="w-full mb-3 p-2 border rounded" required>

    <input type="number" name="price" placeholder="Price"
      class="w-full mb-3 p-2 border rounded" required>

    <button class="w-full bg-blue-500 text-white py-2 rounded">
      Save Order
    </button>
  </form>

  <a href="/" class="block text-center mt-3 text-gray-500">Back</a>
</div>

</body>
</html>
